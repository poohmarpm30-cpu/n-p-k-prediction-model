<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NPK Soil Balance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero">
  <div class="langRow">
    <button class="chip active" id="langTh" onclick="setLang('th')">ไทย</button>
    <button class="chip" id="langEn" onclick="setLang('en')">EN</button>
    <button class="chip" id="langZh" onclick="setLang('zh')">中文</button>
  </div>
  <h1 data-i18n="heroTitle"></h1>
  <button type="button" class="projChip" id="projChip" hidden onclick="goStep(0)"></button>
</div>

<nav class="stepper" id="stepper" aria-label="steps"></nav>

<section class="step" id="step-project" data-step="0" hidden>
  <div class="stepHead"><div class="stepNo" data-w="stepOf"></div><h2 data-w="t_project"></h2><p data-w="d_project"></p></div>
<div class="card">
  <div class="grid">
    <div class="full"><label for="projName"><span data-w="lblName"></span> <span class="req">*</span></label>
      <input id="projName" maxlength="80" autocomplete="off" required aria-describedby="projErr"><div class="err" id="projErr" hidden data-w="errName"></div></div>
    <div><label for="projOwner"><span data-w="lblOwner"></span> <span class="opt" data-w="optional"></span></label><input id="projOwner" maxlength="80" autocomplete="off"></div>
    <div><label for="projPlace"><span data-w="lblPlace"></span> <span class="opt" data-w="optional"></span></label><input id="projPlace" maxlength="80" autocomplete="off"></div>
    <div><label for="projVariety"><span data-w="lblVariety"></span> <span class="opt" data-w="optional"></span></label><input id="projVariety" maxlength="60" autocomplete="off"></div>
    <div><label for="projDate"><span data-w="lblDate"></span></label><input id="projDate" type="date"></div>
    <div class="full"><label for="projNote"><span data-w="lblNote"></span> <span class="opt" data-w="optional"></span></label><textarea id="projNote" rows="2" maxlength="300"></textarea></div>
  </div>
</div>
</section>
<section class="step" id="step-field" data-step="1" hidden>
  <div class="stepHead"><div class="stepNo" data-w="stepOf"></div><h2 data-w="t_field"></h2><p data-w="d_field"></p></div>
<div class="card">
  <h3 data-i18n="cardField"></h3>
  <label data-i18n="lblUnit"></label>
  <div class="seg" role="group"><button id="unitRai" onclick="setUnit('rai')">kg/ไร่</button><button id="unitHa" onclick="setUnit('ha')">kg/ha</button></div>
  <div class="grid" style="margin-top:12px">
    <div><label for="dur" data-i18n="lblDur"></label><input id="dur" type="number" min="30" max="200" value="120"></div>
    <div><label for="ymax" data-i18n="lblYmax"></label><input id="ymax" type="number" step="10"><div class="hint" data-i18n="hintYmax"></div></div>
    <div><label for="soilType" data-i18n="lblSoilType"></label>
      <select id="soilType" onchange="applySoilType()"><option value="clay" data-i18n="soilClay"></option><option value="loam" data-i18n="soilLoam"></option><option value="sandy" data-i18n="soilSandy"></option><option value="custom" data-i18n="soilCustom"></option></select>
      <div class="hint" data-i18n="hintSoilType"></div></div>
  </div>
  <h4 data-i18n="soilTestTitle"></h4>
  <div class="grid">
    <div><label for="initN" data-i18n="lblInitN"></label><input id="initN" type="number" value="10"><div class="hint" data-i18n="hintInitN"></div></div>
    <div><label for="ppmP" data-i18n="lblPpmP"></label><input id="ppmP" type="number" step="0.1" value="7"></div>
    <div><label for="ppmK" data-i18n="lblPpmK"></label><input id="ppmK" type="number" value="55"></div>
    <div><label for="ppmF" data-i18n="lblPpmF"></label><input id="ppmF" type="number" step="0.05" value="2.25"><div class="hint" data-i18n="hintPpmF"></div></div>
  </div>
</div>
</section>
<section class="step" id="step-fert" data-step="2" hidden>
  <div class="stepHead"><div class="stepNo" data-w="stepOf"></div><h2 data-w="t_fert"></h2><p data-w="d_fert"></p></div>
<div class="card">
  <h3 data-i18n="cardFert"></h3>
  <div class="hint" style="margin:-4px 0 8px" data-i18n="presetHint"></div>
  <div class="presetRow">
    <button class="preset" onclick="applyPreset('npsClay')" data-i18n="pNpsClay"></button>
    <button class="preset" onclick="applyPreset('npsLoam')" data-i18n="pNpsLoam"></button>
    <button class="preset" onclick="applyPreset('psClay')" data-i18n="pPsClay"></button>
    <button class="preset" onclick="applyPreset('psLoam')" data-i18n="pPsLoam"></button>
  </div>
  <div id="fertContainer"></div>
  <button type="button" class="addBtn" onclick="addFertRow(0,'46-0-0',0)" data-i18n="addFertBtn"></button>
  <div id="warn" class="warnBox" hidden></div>
</div>
</section>
<section class="step" id="step-params" data-step="3" hidden>
  <div class="stepHead"><div class="stepNo" data-w="stepOf"></div><h2 data-w="t_params"></h2><p data-w="d_params"></p></div>
<div class="note" data-w="paramsNote"></div>
<div class="nutTabs" role="group">
  <button class="nut-btn" id="nutBtnN" aria-pressed="true" onclick="setNutrient('N')">N</button>
  <button class="nut-btn" id="nutBtnP" aria-pressed="false" onclick="setNutrient('P')">P</button>
  <button class="nut-btn" id="nutBtnK" aria-pressed="false" onclick="setNutrient('K')">K</button>
</div>
<div id="nutrientPanels"></div>
</section>
<section class="step" id="step-results" data-step="4" hidden>
  <div class="stepHead"><div class="stepNo" data-w="stepOf"></div><h2 data-w="t_results"></h2><p data-w="d_results"></p></div>
<div class="projBanner" id="projBanner"></div>
<div class="card" id="resultCard" hidden>
  <h3 data-i18n="resTitle"></h3>
  <div class="summary" id="summary"></div>
  <div class="yieldBox">
    <div><label data-i18n="yieldTitle"></label><div class="v" id="yieldVal">-</div></div>
    <div class="hint" id="yieldNote" style="flex:1; min-width:180px"></div>
  </div>
  <h4 data-i18n="recTitle"></h4>
  <div id="recBox" class="recList"></div>
</div>

<div class="card" id="detailCard" hidden>
  <div class="nutTabs detTabs" role="group">
    <button class="nut-btn" id="detBtnN" aria-pressed="true" onclick="setNutrient('N')">🟢 N</button>
    <button class="nut-btn" id="detBtnP" aria-pressed="false" onclick="setNutrient('P')">🟣 P</button>
    <button class="nut-btn" id="detBtnK" aria-pressed="false" onclick="setNutrient('K')">🔵 K</button>
  </div>
  <h3 id="detailHeader"></h3>
  <div class="stats" id="detailStats"></div>
  <div class="tabs" role="group">
    <button class="tab-btn" id="tabLine" aria-pressed="true" onclick="renderChart('line')" data-i18n="tabLine"></button>
    <button class="tab-btn" id="tabBar" aria-pressed="false" onclick="renderChart('bar')" data-i18n="tabBar"></button>
    <button class="tab-btn" id="tabPie" aria-pressed="false" onclick="renderChart('pie')" data-i18n="tabPie"></button>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
  <h4 data-i18n="fieldTitle"></h4>
  <div class="field-wrap">
    <svg viewBox="0 0 260 190" width="260" height="190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f0"/><stop offset="1" stop-color="#eaf6ec"/></linearGradient>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1"><stop id="waterStop1" offset="0" stop-color="#8fd08a"/><stop id="waterStop2" offset="1" stop-color="#4f8f6a"/></linearGradient>
      </defs>
      <rect x="0" y="0" width="260" height="190" rx="14" fill="url(#sky)"/>
      <circle cx="222" cy="30" r="16" fill="#ffd873"/>
      <ellipse cx="50" cy="26" rx="20" ry="8" fill="#ffffff" opacity=".8"/>
      <ellipse cx="80" cy="20" rx="14" ry="6" fill="#ffffff" opacity=".8"/>
      <rect x="10" y="55" width="240" height="115" rx="8" fill="#9c8358"/>
      <path id="waterPath" fill="url(#waterGrad)"/>
      <g id="plants"></g>
    </svg>
    <div class="field-info">
      <div class="stat"><div class="v" id="fieldPct">-</div><div class="l" data-i18n="fieldPctLabel"></div></div>
      <div class="hint" id="fieldMsg"></div>
      <div class="verdict" id="verdict">-</div>
    </div>
  </div>
  <div class="tbl-wrap"><table id="tbl"></table></div>
  <details class="src"><summary data-i18n="srcTitle"></summary><div id="srcBody"></div></details>
</div>
</section>
<section class="step" id="step-ai" data-step="5" hidden>
  <div class="stepHead"><div class="stepNo" data-w="stepOf"></div><h2 data-w="t_ai"></h2><p data-w="d_ai"></p></div>
<div class="card aiIntro">
  <p data-w="aiIntro"></p>
  <button type="button" id="aiBtn" class="aiBtn" onclick="runAIDashboard()"></button>
</div>
<div class="card aiDash" id="aiDash" hidden>
  <div class="dashHeader"><div><h3 id="dashTitle" style="border:none;padding:0;margin:0"></h3><div class="hint" id="dashSub"></div></div>
    <button type="button" id="dashRegen" class="preset" onclick="runAIDashboard(true)"></button></div>
  <div id="dashStale" class="verdict v-mid" hidden style="margin-bottom:10px"></div>
  <div id="dashBody"></div>
</div>
</section>

<div class="navbar">
  <button type="button" class="navBtn back" id="navBack" onclick="goStep(cur-1)"></button>
  <div class="liveMini" id="liveMini"></div>
  <button type="button" class="navBtn next" id="navNext" onclick="goStep(cur+1)"></button>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>
<script src="wizard.js"></script>
</body>
</html>
